{% assign google_tracking_id = site.analytics.google.tracking_id | default: "" | strip %}
{% if jekyll.environment == "production" and google_tracking_id != "" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ google_tracking_id | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', {{ google_tracking_id | jsonify }});
</script>
{% endif %}
